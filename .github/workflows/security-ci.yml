name: Build and security checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libssl-dev python3
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install openssl@3.5
          echo "OPENSSL_PREFIX=$(brew --prefix openssl@3.5)" >> "$GITHUB_ENV"
          echo 'PKG_CONFIG=false' >> "$GITHUB_ENV"
      - name: Build and test
        run: make -j2 test-all
  sanitizers:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y clang make pkg-config libssl-dev python3
      - name: ASan and UBSan
        run: |
          make -j2 CC=clang \
            CFLAGS='-O1 -g -Wall -Wextra -Wpedantic -Wformat=2 -Wformat-security -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer' \
            LDFLAGS='-fsanitize=address,undefined' test-all
